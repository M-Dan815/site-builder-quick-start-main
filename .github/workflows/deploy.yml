name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Build Docker image
        run: docker build -t frontend-app .

      - name: Save Docker image as tar
        run: docker save frontend-app | gzip > frontend-app.tar.gz

      - name: Copy image to droplet
        run: |
          scp -o StrictHostKeyChecking=no frontend-app.tar.gz root@${{ secrets.DROPLET_IP }}:${{ secrets.FRONTEND_PATH }}/

      - name: Deploy Docker container
        run: |
          ssh root@${{ secrets.DROPLET_IP }} << 'EOF'
            cd $FRONTEND_PATH
            docker load < frontend-app.tar.gz
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 80:80 --restart unless-stopped frontend-app
          EOF
