name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout Frontend
        uses: actions/checkout@v3

      # 2️⃣ Enable SSH
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t frontend-app .

      # 4️⃣ Save image to tar
      - name: Save Docker image as tar
        run: |
          docker save frontend-app | gzip > frontend-app.tar.gz

      # 5️⃣ Ensure target dir exists on droplet
      - name: Prepare droplet directory
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_IP }} \
            "mkdir -p ${{ secrets.APP_PATH }}"

      # 6️⃣ Copy image to droplet
      - name: Copy image to droplet
        run: |
          scp -o StrictHostKeyChecking=no frontend-app.tar.gz \
            root@${{ secrets.DROPLET_IP }}:${{ secrets.APP_PATH }}/

      # 7️⃣ Deploy container
      - name: Deploy Docker container
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_IP }} << EOF
            set -e

            cd ${{ secrets.APP_PATH }}

            echo "📦 Loading Docker image..."
            docker load < frontend-app.tar.gz

            echo "🛑 Stopping old container..."
            docker stop frontend || true
            docker rm frontend || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 3000:80 \
              frontend-app

            echo "✅ Deployment complete"
          EOF
